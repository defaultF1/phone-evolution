<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Telephone Scrolls</title>
<meta name="theme-color" content="#04060a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- effects used by the line-sketch fallbacks -->
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#cfd6e2" stroke-width="1" opacity=".55"/>
    </pattern>
    <pattern id="xhatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#cfd6e2" stroke-width="1" opacity=".5"/>
      <line x1="0" y1="0" x2="5" y2="0" stroke="#cfd6e2" stroke-width="1" opacity=".5"/>
    </pattern>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r=".9" fill="#cfd6e2" opacity=".5"/>
    </pattern>
  </defs>
</svg>

<div class="desk">
  <div class="sheet">
    <header class="bar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 19 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M9.5 0v9"/><rect x="2.5" y="9" width="14" height="30" rx="2.5"/><rect x="5.5" y="12.5" width="8" height="5" rx="1" fill="currentColor" stroke="none"/>
          <path d="M5.5 22h8M5.5 26h8M5.5 30h8M5.5 34h8" stroke-dasharray="1.8 1.3"/>
        </svg>
        <span class="brand-name">The Telephone Scrolls</span>
        <span class="chapter-badge" id="chapterBadge">Chapter I</span>
      </div>

      <nav class="tabs" id="tabs" aria-label="Chapters"></nav>

      <div class="tools">
        <button class="btn" id="voyageBtn" title="Play through every phone in order"><span class="ico">&#9654;</span> <span class="t">Voyage</span></button>
        <button class="btn" id="ledgerBtn" title="See every phone at once"><span class="ico">&#9638;</span> <span class="t" id="ledgerLabel">All Phones</span></button>
        <button class="btn btn-sq" id="soundBtn" title="Sound off" aria-pressed="false">&#9834;</button>
      </div>
    </header>

    <section class="head" id="head">
      <p class="meta"><span class="date" id="date"></span><span class="sep">&middot;</span><span id="line"></span><span class="sep">&middot;</span><span class="count" id="count"></span></p>
      <h1 class="title" id="title"></h1>
      <p class="tagline" id="tagline"></p>
    </section>

    <section class="stage" id="stage" aria-label="Phone carousel. Drag, scroll or use the arrow keys.">
      <div class="ghost" id="ghost" aria-hidden="true"></div>
      <div class="floor" aria-hidden="true"></div>
      <div class="items" id="items"></div>
      <div class="empty" id="empty" hidden>The collection is still loading. Reload in a moment.</div>
    </section>

    <section class="foot">
      <div class="specs" id="specs"></div>
      <button class="cta" id="taleBtn">Unroll the Full Tale <span aria-hidden="true">&rsaquo;</span></button>
    </section>

    <section class="scrub">
      <button class="nav" id="prevBtn" aria-label="Previous phone">&lsaquo;</button>
      <div class="track" id="track">
        <div class="strip" id="strip"></div>
        <div class="marker" id="marker" aria-hidden="true"><b></b><i></i></div>
      </div>
      <button class="nav" id="nextBtn" aria-label="Next phone">&rsaquo;</button>
    </section>
  </div>
</div>

<!-- story scroll -->
<div class="veil" id="taleVeil" hidden>
  <div class="tale" id="tale" role="dialog" aria-modal="true" aria-labelledby="taleTitle">
    <div class="tale-body">
      <div class="tale-scroll">
        <header class="tale-head">
          <div>
            <p class="meta left"><span class="date" id="taleDate"></span><span class="sep">&middot;</span><span id="taleLine"></span></p>
            <h2 class="tale-title" id="taleTitle"></h2>
          </div>
          <div class="tale-tools">
            <button class="btn" id="bellBtn">&#9834; Ring the Era Bell</button>
            <button class="close" id="taleClose" aria-label="Close">&#10005;</button>
          </div>
        </header>
        <div class="tale-grid">
          <figure class="plate">
            <div class="plate-art" id="taleArt"></div>
            <figcaption><span id="taleCap"></span><span class="credit" id="taleCredit"></span></figcaption>
          </figure>
          <div class="tale-text">
            <p class="story" id="taleStory"></p>
            <div class="box">
              <h3>Craft &amp; Engineering Milestones</h3>
              <ul id="taleMiles"></ul>
            </div>
            <div class="note">
              <h3>Archivist's Note</h3>
              <p id="taleNote"></p>
            </div>
            <p class="sources" id="taleSources"></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- full ledger -->
<div class="veil" id="ledgerVeil" hidden>
  <div class="ledger" role="dialog" aria-modal="true" aria-label="All phones">
    <header class="ledger-head">
      <h2>The Full Ledger</h2>
      <button class="close" id="ledgerClose" aria-label="Close">&#10005;</button>
    </header>
    <div class="ledger-body" id="ledgerBody"></div>
  </div>
</div>

<script src="data/phones-a.js"></script>
<script src="data/phones-b.js"></script>
<script src="data/phones-c.js"></script>
<script src="photos.js"></script>
<script src="sketches.js"></script>
<script src="sketchmap.js"></script>
<script src="app.js"></script>
</body>
</html>
